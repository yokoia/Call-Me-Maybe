[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Constrained function calling with a local small LLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "huggingface-hub",
    "numpy",
    "pydantic>=2",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["llm_sdk/"]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true